<!doctype html>
<html
  lang="he"
  data-composition-variables='[{"id":"accent","type":"color","label":"Accent","default":"#ff3b30"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Reel Studio look: near-black ground, red glow, white heavy type, one red accent. */
      @font-face { font-family: "Heebo"; src: url("assets/fonts/Heebo.ttf"); font-weight: 100 900; }
      :root {
        --ground: #070505;
        --ink: #ffffff;
        --accent: #ff3b30;
        --font-display: "Heebo", "Open Sans", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); direction: rtl; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <!-- Backdrop: dark ground, red glow, moving light streaks. -->
      <div id="backdrop" data-composition-id="backdrop" data-composition-src="compositions/backdrop.html"
           data-start="0" data-duration="8" data-track-index="0" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>

      <!-- One host per scene. Duplicate this for each beat of the script. -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
           data-start="0" data-duration="8" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>

      <!-- Captions host: generated by make_captions.py (replace this line with the printed host). -->

      <!-- Voiceover: assets/voice.mp3 from ElevenLabs or your own recording. -->
      <!-- <audio id="voice" class="clip" src="assets/voice.mp3" data-start="0" data-duration="8" data-track-index="20"></audio> -->
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
